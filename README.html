<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>README</title>
  <!-- VS Code's own Markdown preview stylesheets (VS Code 1.146.0), used as-is.
       They read the --vscode-* colors below and the vscode-dark / vscode-light class. -->
  <link rel="stylesheet" href=".readme-vendor/vscode-markdown.css">
  <link rel="stylesheet" href=".readme-vendor/vscode-highlight.css">
  <style>
    /* VS Code fills this from the editor.fontFamily setting; these are its defaults on Mac, Windows, Linux. */
    :root { --vscode-editor-font-family: Menlo, Consolas, "Droid Sans Mono", monospace; }
    /* Colors from VS Code's "Dark 2026" and "Light 2026" themes. */
    .vscode-dark {
      color-scheme: dark;
      --vscode-editor-background: #121314;
      --vscode-editor-foreground: #BBBEBF;
      --vscode-textLink-foreground: #48A0C7;
      --vscode-textLink-activeForeground: #53A5CA;
      --vscode-textPreformat-foreground: #8C8C8C;
      --vscode-textPreformat-background: #262626;
      --vscode-textCodeBlock-background: #242526;
      --vscode-widget-border: #2A2B2C;
      --vscode-toolbar-activeBackground: #FFFFFF33;
      --vscode-scrollbarSlider-background: #A8A9AA85;
    }
    .vscode-light {
      color-scheme: light;
      --vscode-editor-background: #FFFFFF;
      --vscode-editor-foreground: #202020;
      --vscode-textLink-foreground: #0069CC;
      --vscode-textLink-activeForeground: #0069CC;
      --vscode-textPreformat-foreground: #3B3B3B;
      --vscode-textPreformat-background: #0000001F;
      --vscode-textCodeBlock-background: #ECECEC;
      --vscode-widget-border: #E2E2E5;
      --vscode-toolbar-hoverBackground: #0000001F;
      --vscode-toolbar-activeBackground: #D6D6D8;
      --vscode-scrollbarSlider-background: #646464C0;
    }
    /* The base styles VS Code gives every preview, in its low-priority layer so the stylesheets above win. */
    @layer vscode-default {
      html { scrollbar-color: var(--vscode-scrollbarSlider-background) var(--vscode-editor-background); }
      body { color: var(--vscode-editor-foreground); margin: 0; }
      a { color: var(--vscode-textLink-foreground); }
      a:hover { color: var(--vscode-textLink-activeForeground); }
      code { color: var(--vscode-textPreformat-foreground); background-color: var(--vscode-textPreformat-background); padding: 1px 3px; border-radius: 4px; }
      pre code { background-color: transparent; padding: 0; }
    }
    /* Additions for this page. */
    html { background: var(--vscode-editor-background); }  /* VS Code paints this behind its preview */
    body { max-width: 900px; margin: 0 auto; }  /* a browser tab is wider than VS Code's preview pane */
    nav { position: sticky; top: 0; z-index: 1; line-height: 18px; padding: 2px 0; font-size: 12px;
          background: var(--vscode-editor-background); border-bottom: 1px solid var(--vscode-widget-border); }
    nav button { font: inherit; padding: 0 4px; border: 0; background: none; color: var(--vscode-textLink-foreground); cursor: pointer; }
    h1, h2, h3, h4, h5, h6 { scroll-margin-top: 40px; }  /* anchor jumps land below the sticky bar */
    .code-block-copy-button svg { width: 16px; height: 16px; }  /* VS Code's icon size */
  </style>
  <script>
    // Like VS Code, mark the page vscode-dark or vscode-light; here it follows the system setting.
    // Runs in <head> so the first paint already has the right colors.
    const dark = matchMedia('(prefers-color-scheme: dark)');
    const setTheme = () => { document.documentElement.className = dark.matches ? 'vscode-dark' : 'vscode-light'; };
    setTheme();
    dark.addEventListener('change', setTheme);
  </script>
</head>
<body>
  <nav>
    <button onclick="setAll(true)">[ expand all ]</button>
    <button onclick="setAll(false)">[ collapse all ]</button>
  </nav>
  <main></main>
  <script src=".readme-vendor/marked.min.js"></script>
  <script src=".readme-vendor/highlight.min.js"></script>
  <script>
    const main = document.querySelector('main');

    function setAll(open) {
      for (const d of document.querySelectorAll('details')) d.open = open;
    }

    const COPY_ICON = '<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>';
    const CHECK_ICON = '<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

    // The modern clipboard API works only on a secure page (http://localhost counts, a plain
    // http:// address of another machine does not) and only where the page is allowed to use it
    // (a frame inside another app may not be). If it fails, fall back to the older route VS Code's
    // preview also uses: select the code and run the browser's copy command.
    async function copyText(code) {
      try {
        await navigator.clipboard.writeText(code.textContent);
        return true;
      } catch {
        const range = document.createRange();
        range.selectNodeContents(code);
        getSelection().removeAllRanges();
        getSelection().addRange(range);
        const copied = document.execCommand('copy');
        getSelection().removeAllRanges();
        return copied;
      }
    }

    // VS Code's stylesheet already styles .code-block-copy-button: hidden until the pointer is
    // over the <pre>, green while it has the "copied" class.
    function addCopyButton(code) {
      const button = document.createElement('button');
      button.className = 'code-block-copy-button';
      button.ariaLabel = 'Copy code block';
      button.title = 'Copy';
      button.innerHTML = COPY_ICON;
      let timer;
      button.onclick = async () => {
        // A mouse click focuses the button, and the stylesheet also shows it on :focus; drop that
        // focus so the button hides once the pointer leaves. Keyboard focus (:focus-visible) stays.
        if (!button.matches(':focus-visible')) button.blur();
        if (!await copyText(code)) return;
        button.innerHTML = CHECK_ICON;
        button.classList.add('copied');
        clearTimeout(timer);  // a second click restarts the full 3 s
        timer = setTimeout(() => {
          button.innerHTML = COPY_ICON;
          button.classList.remove('copied');
        }, 3000);
      };
      code.parentElement.append(button);  // last child of <pre>, so the pre:hover rule shows it
    }

    // Needs the Run server: browsers block fetch() from a file:// page.
    // 'no-cache' makes the browser re-check README.md, so a reload shows edits.
    fetch('README.md', { cache: 'no-cache' })
      .then(r => r.text())
      .then(md => {
        main.innerHTML = marked.parse(md);
        // marked labels each code block (class="language-js"); highlight.js colors it by that label.
        for (const code of main.querySelectorAll('pre code')) {
          hljs.highlightElement(code);
          addCopyButton(code);
        }
        // marked adds no heading ids; build GitHub's (ASCII headings only) so links like #how-it-works work.
        for (const h of main.querySelectorAll('h1, h2, h3, h4, h5, h6')) {
          h.id = h.textContent.trim().toLowerCase().replace(/[^\w\- ]/g, '').replace(/ /g, '-');
        }
        document.title = main.querySelector('h1').textContent;
        document.getElementById(location.hash.slice(1))?.scrollIntoView();  // target did not exist at load
      })
      .catch(() => {
        main.textContent = 'Could not load README.md. Start the server (see Run in README.md), then open http://localhost:8000/README.html';
      });
  </script>
</body>
</html>
